  if(u==='usd_bn')return neg+(a>=1000?'$'+nf(a/1000,2)+'tn':'$'+nf(a,0)+'bn');

  if(u==='fx')return neg+nf(a,a>=20?2:4);
  if(u==='ratio')return neg+nf(a,a<0.2?4:2);
  if(u==='k')return neg+nf(a,0)+'k';
  if(u==='count')return neg+nf(a,0);

}
function spark(h,w,ht,col){

function placeScatterLabels(items, opts){
  const W=opts.W, H=opts.H, padL=opts.padL||8, padR=opts.padR||8, padT=opts.padT||14, padB=opts.padB||18, fs=opts.fontSize||9.8;
  const obs=(opts.obstacles||[]).slice();
  items.forEach(it=>{const r=(it.r||5)+3;obs.push([it.x-r,it.y-r,it.x+r,it.y+r])});
  const ov=(a,b)=>{const ix=Math.min(a[2],b[2])-Math.max(a[0],b[0]), iy=Math.min(a[3],b[3])-Math.max(a[1],b[1]);return ix>0&&iy>0?ix*iy:0};
  const dirs=[
    {dx:1,dy:0,anc:'start'},{dx:-1,dy:0,anc:'end'},
    {dx:0,dy:-1,anc:'middle'},{dx:0,dy:1,anc:'middle'},
    {dx:0.75,dy:-0.72,anc:'start'},{dx:-0.75,dy:-0.72,anc:'end'},
    {dx:0.75,dy:0.78,anc:'start'},{dx:-0.75,dy:0.78,anc:'end'}
  ];
  const radii=[8,14,22,31,42,54,68];
  return items.map(it=>{
    const txt=String(it.text||'');
    const w=txt.length*fs*0.68+8, h=fs*1.28+4;
    let best=null, bestScore=Infinity;
    for(let ri=0;ri<radii.length;ri++){
      const d=radii[ri];
      for(let di=0;di<dirs.length;di++){
        const dr=dirs[di];
        let tx=it.x+dr.dx*d, ly=it.y+dr.dy*d+(dr.dy===0?fs*0.35:(dr.dy>0?fs*0.75:0));
        const anc=dr.anc;
        let x0=anc==='start'?tx:(anc==='end'?tx-w:tx-w/2), x1=x0+w;
        if(x0<padL){const sh=padL-x0;tx+=sh;x0=padL;x1+=sh}
        if(x1>W-padR){const sh=x1-(W-padR);tx-=sh;x0-=sh;x1=W-padR}
        let y0=ly-fs*0.95, y1=y0+h;
        if(y0<padT){const sh=padT-y0;ly+=sh;y0=padT;y1+=sh}
        if(y1>H-padB){const sh=y1-(H-padB);ly-=sh;y1=H-padB;y0-=sh}
        const box=[x0-2,y0-2,x1+2,y1+2];
        let sc=0;for(let oi=0;oi<obs.length;oi++)sc+=ov(box,obs[oi]);
        const dist=Math.hypot((x0+x1)/2-it.x,(y0+y1)/2-it.y);
        const total=sc*1000+dist*0.1;
        if(sc===0){best={tx,ly,anc,box,x0,y0,x1,y1};bestScore=0;break}
        if(total<bestScore){bestScore=total;best={tx,ly,anc,box,x0,y0,x1,y1}}
      }
      if(bestScore===0)break;
    }
    obs.push(best.box);
    const nx=Math.max(best.x0,Math.min(it.x,best.x1)), ny=Math.max(best.y0,Math.min(it.y,best.y1));
    const ldist=Math.hypot(nx-it.x,ny-it.y);
    return Object.assign({},it,{tx:best.tx,ly:best.ly,anc:best.anc,lx:nx,lyEnd:ny,leader:ldist>10});
  });
}

function allocMap(){
  const m={}, W=V.where||{};
  ['near','far'].forEach(hz=>{
    const blk=W[hz]||{};
    [['favoured','Favoured'],['neutral','Neutral'],['avoid','Avoid']].forEach(g=>{
      (blk[g[0]]||[]).forEach(it=>{if(it.ticker)m[it.ticker]=m[it.ticker]||{hz:hz,stance:g[1],why:it.why}});
    });
  });
  return m;
}

function rrgSvg(rot,amap){
  const W=460,H=276,P=36,cx=W/2,cy=(H-14)/2+4;
  if(!rot||!rot.length)return '<p class="mut sm">No rotation data.</p>';
  let mxX=8,mxY=5;
  rot.forEach(r=>{if(Math.abs(r.rs_3m)>mxX)mxX=Math.abs(r.rs_3m);if(Math.abs(r.mom_accel)>mxY)mxY=Math.abs(r.mom_accel)});
  mxX*=1.12;mxY*=1.15;
  const col=q=>q==='Leading'?'var(--up)':q==='Weakening'?'var(--warn-c)':q==='Improving'?'var(--accent)':'var(--down)';
  const rawPts=rot.map((r,idx)=>({
    idx:idx,rObj:r,text:r.id.toUpperCase(),r:amap[r.id]?9:5.5,
    x:cx+(r.rs_3m/mxX)*(cx-P-8), y:cy-(r.mom_accel/mxY)*(cy-24)
  }));
  const placed=placeScatterLabels(rawPts,{
    W:W,H:H,padL:P+4,padR:P+4,padT:34,padB:44,fontSize:9.5,
    obstacles:[[P,18,P+86,36],[W-P-76,18,W-P,36],[P,H-44,P+76,H-24],[W-P-90,H-44,W-P,H-24]]
  });
  const pts=placed.map(p=>{
    const r=p.rObj, al=amap[r.id];
    const halo=al?(al.stance==='Favoured'?'<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="8.5" fill="none" stroke="var(--up)" stroke-width="1.6"/>':al.stance==='Avoid'?'<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="8.5" fill="none" stroke="var(--down)" stroke-width="1.5" stroke-dasharray="2 2"/>':''):'';
    return '<g class="rrg-pt" data-i="'+p.idx+'" style="cursor:pointer">'
      +(p.leader?'<line x1="'+p.x.toFixed(1)+'" y1="'+p.y.toFixed(1)+'" x2="'+p.lx.toFixed(1)+'" y2="'+p.lyEnd.toFixed(1)+'" stroke="var(--line2)" stroke-width="1" opacity="0.7"/>':'')
      +halo
      +'<circle class="rrg-dot" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="4.8" fill="'+col(r.quadrant)+'" stroke="var(--bg)" stroke-width="1.4"/>'
      +'<text x="'+p.tx.toFixed(1)+'" y="'+p.ly.toFixed(1)+'" text-anchor="'+p.anc+'" font-size="9.5" font-weight="600" fill="var(--ink)">'+esc(p.text)+'</text></g>';
  }).join('');
  return '<div class="pc" id="rrg-box"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Relative strength rotation quadrant">'
    +'<rect x="'+P+'" y="18" width="'+(cx-P)+'" height="'+(cy-18)+'" fill="rgba(56,189,248,0.08)"/>'
    +'<rect x="'+cx+'" y="18" width="'+(W-P-cx)+'" height="'+(cy-18)+'" fill="rgba(52,211,153,0.09)"/>'
    +'<rect x="'+P+'" y="'+cy+'" width="'+(cx-P)+'" height="'+(H-26-cy)+'" fill="rgba(251,113,133,0.10)"/>'
    +'<rect x="'+cx+'" y="'+cy+'" width="'+(W-P-cx)+'" height="'+(H-26-cy)+'" fill="rgba(251,191,36,0.08)"/>'
    +'<line x1="'+P+'" x2="'+(W-P)+'" y1="'+cy+'" y2="'+cy+'" stroke="var(--line2)"/>'
    +'<line x1="'+cx+'" x2="'+cx+'" y1="18" y2="'+(H-26)+'" stroke="var(--line2)"/>'
    +'<text x="'+(P+5)+'" y="30" font-size="10" font-weight="600" fill="var(--accent)">IMPROVING</text>'
    +'<text x="'+(W-P-5)+'" y="30" text-anchor="end" font-size="10" font-weight="600" fill="var(--up)">LEADING</text>'
    +'<text x="'+(P+5)+'" y="'+(H-31)+'" font-size="10" font-weight="600" fill="var(--down)">LAGGING</text>'
    +'<text x="'+(W-P-5)+'" y="'+(H-31)+'" text-anchor="end" font-size="10" font-weight="600" fill="var(--warn-c)">WEAKENING</text>'
    +pts
    +'<text x="'+cx+'" y="'+(H-7)+'" text-anchor="middle" font-size="9.5" fill="var(--ink3)">3m RS vs S&amp;P 500 (pp) · Ring: green=Favoured, dashed=Avoid →</text>'

  const W=420, rowH=25, H=corrs.length*rowH+26, L=148, R=18;
  const X=v=>L+(W-L-R)*(Math.max(-1,Math.min(1,v))+1)/2;

  [-1,-0.5,0,0.5,1].forEach(v=>{g+='<text x="'+X(v).toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle" font-size="9.5" fill="var(--ink3)">'+(v>0?'+'+v:v)+'</text>'});
  corrs.forEach((c,i)=>{
    if(c.corr_13w==null||c.corr_52w==null)return;

    g+='<text x="'+(L-8)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="10.5" fill="var(--ink)">'+esc(c.label)+'</text>'
      +'<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--panel2)" stroke-width="5" stroke-linecap="round"/>'
      +'<line x1="'+x52.toFixed(1)+'" x2="'+x13.toFixed(1)+'" y1="'+y+'" y2="'+y+'" stroke="'+col+'" stroke-width="2.6"/>'

  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+g+'</svg>';

function eastWestPanelHtml(ew){
  if(!ew||!ew.available)return '';
  const pillCls=ew.tone==='good'?'good':ew.tone==='bad'?'bad':ew.tone==='warn'?'warn':'b2';
  const h28=ew.history_28w;
  let chartSvg='<p class="mut xs">Insufficient weekly history for drawdown chart.</p>';
  if(h28&&h28.dates&&h28.dates.length>3){
    const W=460,H=214,L=36,R=88,T=12,B=24,pw=W-L-R,ph=H-T-B,n=h28.dates.length;
    const X=i=>L+(i/Math.max(1,n-1))*pw, Y=v=>T+((0-Math.max(-75,Math.min(0,v)))/75)*ph;
    let g='';
    [0,-20,-40,-60].forEach(gv=>{
      const py=Y(gv), isB=gv===-20;
      g+='<line x1="'+L+'" y1="'+py.toFixed(1)+'" x2="'+(W-R)+'" y2="'+py.toFixed(1)+'" stroke="'+(isB?'var(--down)':'var(--grid)')+'" stroke-dasharray="'+(isB?'4 3':'2 3')+'" opacity="'+(isB?0.7:0.85)+'"/>'
        +'<text x="'+(L-5)+'" y="'+(py+3.5).toFixed(1)+'" text-anchor="end" font-family="var(--mono)" font-size="9.5" fill="'+(isB?'var(--down)':'var(--ink3)')+'">'+gv+'%</text>';
    });
    const defs=[
      {k:'softbank',lbl:'9984.T',c:'var(--down)',w:1.8},
      {k:'skhynix',lbl:'Hynix',c:'var(--s4)',w:1.8},
      {k:'kospi',lbl:'KOSPI',c:'var(--s2)',w:1.7},
      {k:'nikkei',lbl:'Nikkei',c:'var(--warn-c)',w:1.7},
      {k:'ndx',lbl:'NDX',c:'var(--accent)',w:2.1},
      {k:'spx',lbl:'SPX',c:'var(--ink)',w:2.4}
    ];
    const ends=[];
    defs.forEach(s=>{
      const arr=h28.dd[s.k];if(!arr||!arr.length)return;
      const pts=arr.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
      const lv=arr[arr.length-1];
      g+='<polyline fill="none" stroke="'+s.c+'" stroke-width="'+s.w+'" points="'+pts+'" stroke-linejoin="round"/>'
        +'<circle cx="'+X(n-1).toFixed(1)+'" cy="'+Y(lv).toFixed(1)+'" r="2.8" fill="'+s.c+'"/>';
      ends.push({lbl:s.lbl+' '+lv.toFixed(1)+'%',v:lv,c:s.c,y:Y(lv)+3});
    });
    ends.sort((a,b)=>b.v-a.v);
    const minGap=12, yMax=H-B-2;
    for(let i=0;i<ends.length;i++){
      if(i>0&&ends[i].y-ends[i-1].y<minGap)ends[i].y=ends[i-1].y+minGap;
    }
    if(ends.length&&ends[ends.length-1].y>yMax){
      ends[ends.length-1].y=yMax;
      for(let i=ends.length-2;i>=0;i--){
        if(ends[i+1].y-ends[i].y<minGap)ends[i].y=ends[i+1].y-minGap;
      }
    }
    ends.forEach(e=>{
      g+='<text x="'+(W-R+5)+'" y="'+e.y.toFixed(1)+'" font-family="var(--mono)" font-size="9" font-weight="600" fill="'+e.c+'">'+esc(e.lbl)+'</text>';
    });
    [0,Math.floor(n/3),Math.floor(2*n/3),n-1].forEach(i=>{
      g+='<text x="'+X(i).toFixed(1)+'" y="'+(H-5)+'" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="var(--ink3)">'+esc(h28.dates[i].slice(5))+'</text>';
    });
    chartSvg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+g+'</svg>';
  }

  const rows=(ew.components||[]).slice();
  if(ew.foundry_contrast&&ew.foundry_contrast.dd_52w!=null){
    rows.push({label:ew.foundry_contrast.label,dd_52w:ew.foundry_contrast.dd_52w,lead_days_vs_spx:ew.foundry_contrast.lead_days_vs_spx,in_bear:ew.foundry_contrast.dd_52w<=-20,above_8w:null,is_contrast:true});
  }
  const tbl='<table class="tbl" style="font-size:11.8px"><thead><tr><th>Benchmark</th><th class="r">52w DD</th><th class="r">Lead vs SPX</th><th class="r">8w MA</th></tr></thead><tbody>'
    +rows.map(c=>{
      const ld=c.lead_days_vs_spx;
      const ldTxt=ld==null?'–':(ld>0?'+'+ld+'d early':ld<0?ld+'d lag':'0d sync');
      const m8=c.above_8w==null?'<span class="mut">–</span>':(c.above_8w?'<span class="up">▲ Above</span>':'<span class="down">▼ Below</span>');
      return '<tr><td><b>'+esc(c.label)+'</b>'+(c.is_contrast?' <span class="xs mut">[Foundry]</span>':'')+'</td>'
        +'<td class="num '+(c.in_bear?'down':'mut')+'"><b>'+(c.dd_52w!=null?c.dd_52w.toFixed(1)+'%':'–')+'</b></td>'
        +'<td class="num '+(ld&&ld>14?'warn-txt':'mut')+'">'+ldTxt+'</td>'
        +'<td class="num">'+m8+'</td></tr>';
    }).join('')+'</tbody></table>'
    +'<div class="kv" style="margin:8px 0 0">'
    +'<div><dt>Vol-Adj East DD</dt><dd class="num down" style="font-size:15px">'+ew.east_dd.toFixed(1)+'%</dd></div>'
    +'<div><dt>East Bears</dt><dd class="num" style="font-size:15px">'+ew.bear_breadth+'/4</dd></div>'
    +'<div><dt>Upturn Core (&gt;8w)</dt><dd class="num '+(ew.upturn_above_8w>=2?'up':'down')+'" style="font-size:15px">'+ew.upturn_above_8w+'/'+ew.upturn_total+'</dd></div>'
    +'<div><dt>EW Z-Spread / Gate</dt><dd class="num" style="font-size:14px">'+(ew.ew_z_spread!=null?sg(ew.ew_z_spread):'–')+' <span class="xs mut">'+(ew.rates_tightening?'· Hike':'· Easy')+'</span></dd></div>'
    +'</div>';

  return '<div class="panel" style="margin-bottom:12px">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px">'
    +'<div><span class="xs mut">DUAL-MODE EAST-WEST CYCLE CANARY</span> · <b style="font-size:14.5px">'+esc(ew.label)+'</b> <span class="xs mut">— '+esc(ew.summary||'')+'</span></div>'
    +'<span class="pill '+pillCls+'">Spread '+(ew.dd_spread>0?'+':'')+ew.dd_spread.toFixed(1)+'pp</span></div>'
    +'<div class="grid2" style="align-items:center"><div><div class="xs mut" style="margin-bottom:4px">28-Week 52w-Drawdown Lead Trajectory (Local-FX Indices &amp; Split-Adj Canaries)</div>'+chartSvg+'</div><div>'+tbl+'</div></div></div>';
}

        ab.innerHTML='<div class="alloc-grid single">'
          +'<div class="alloc-desk-hd"></div><div class="alloc-hd">'+esc(lbl)+'</div>'
          +rows.map(r=>'<div class="alloc-lbl '+(r[1]==='mut-lbl'?'':r[1])+'"'+(r[1]==='mut-lbl'?' style="background:var(--panel2);color:var(--ink2)"':'')+'>'+r[0]+'</div>'+cell(blk,r[2],'')).join('')+'</div>';

    };

    box.querySelectorAll('.rrg-pt').forEach(node=>{

          +'3m RS vs SPX: <b class="mono">'+(r.rs_3m>=0?'+':'')+r.rs_3m+'pp</b> · Accel: <b class="mono">'+(r.mom_accel>=0?'+':'')+r.mom_accel+'</b><br>'
          +'1m: <span class="mono">'+r.chg_1m+'%</span> · 3m: <span class="mono">'+r.chg_3m+'%</span>'
          +(al?'<br><span class="mut">Call: <b>'+esc(al.stance)+'</b></span>':'');
        tip.hidden=false;
        const rect=box.getBoundingClientRect();
        const tw=tip.offsetWidth||200;
        tip.style.left=Math.max(4,Math.min(rect.width-tw-4,e.clientX-rect.left+12))+'px';
        tip.style.top=Math.max(8,e.clientY-rect.top-10)+'px';
      });
      node.addEventListener('pointerleave',()=>{tip.hidden=true});
      node.addEventListener('click',()=>{setRrg(idx)});
    });
  }
}

function cotRangeSvg(rows){
  if(!rows||!rows.length)return '<p class="mut sm">No COT data.</p>';
  const W=450, rowH=30, H=rows.length*rowH+26, L=155, R=72;
  const X=p=>L+(W-L-R)*Math.max(0,Math.min(100,p))/100;
  let g='<rect x="'+X(0)+'" y="8" width="'+(X(20)-X(0))+'" height="'+(H-26)+'" fill="rgba(52,211,153,0.09)"/>'
    +'<rect x="'+X(85)+'" y="8" width="'+(X(100)-X(85))+'" height="'+(H-26)+'" fill="rgba(251,191,36,0.10)"/>'
    +'<line x1="'+X(50)+'" x2="'+X(50)+'" y1="8" y2="'+(H-18)+'" stroke="var(--line2)" stroke-dasharray="2 2"/>';
  [0,20,50,85,100].forEach(p=>{g+='<text x="'+X(p).toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle" font-size="9.5" fill="var(--ink3)">'+p+'th</text>'});
  rows.forEach((r,i)=>{
    const y=20+i*rowH, p=r.pct3y!=null?r.pct3y:50, xp=X(p);
    const col=p<=20?'var(--up)':p>=85?'var(--warn-c)':'var(--accent)';
    g+='<text x="'+(L-8)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="10.5" font-weight="500" fill="var(--ink)">'+esc(r.label)+'</text>'
      +'<line x1="'+X(0)+'" x2="'+X(100)+'" y1="'+y+'" y2="'+y+'" stroke="var(--panel2)" stroke-width="6" stroke-linecap="round"/>'
      +'<circle cx="'+xp.toFixed(1)+'" cy="'+y+'" r="5.2" fill="'+col+'" stroke="var(--bg)" stroke-width="1.5"><title>Net: '+(r.net!=null?nf(r.net,0):'–')+' ('+p+'th 3y pct · '+esc(r.state)+')</title></circle>'
      +'<text x="'+(W-R+8)+'" y="'+(y+3.5)+'" font-family="var(--mono)" font-size="10" fill="'+col+'">'+p+'th</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+g+'</svg>';
}

function insiderSectorSvg(sec){
  if(!sec||!sec.length)return '';
  const items=sec.slice().sort((a,b)=>(b.buys_usd||0)-(a.buys_usd||0)).slice(0,6);
  const mx=Math.max.apply(null,items.map(s=>Math.max(s.buys_usd||0,s.sells_usd||0)).concat([1e6]));

    +items.map(s=>{
      const bw=Math.round((s.buys_usd||0)/mx*100), sw=Math.round((s.sells_usd||0)/mx*100);

        +'<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(s.sector.replace('Information ','').replace('Consumer ',''))+'</span>'

        +'<div style="height:4px;background:var(--panel2);border-radius:2px"><div style="width:'+sw+'%;height:100%;background:var(--down);border-radius:2px;opacity:.75"></div></div></div>'
        +'<span class="mono xs" style="text-align:right"><span class="up">$'+nf((s.buys_usd||0)/1e6,0)+'m</span> / <span class="mut">$'+nf((s.sells_usd||0)/1e6,0)+'m</span></span></div>';

const PC={};
function pathChart(id,p){
  const s=S[id],W=560,H=235,L=58,R=14,T=12,B=26;
  const mend=ym=>Date.UTC(+ym.slice(0,4),+ym.slice(5,7),0);
  const hist=[];
  if(s&&s.h){const t0=pd(s.h0).getTime();s.h.forEach((v,i)=>{if(v!=null)hist.push([t0+i*6048e5+4*864e5,v])})}
  const lastT=s&&s.date?pd(s.date).getTime():TODAY.getTime(),lastV=s?s.last:null;
  while(hist.length&&hist[hist.length-1][0]>=lastT)hist.pop();
  if(lastV!=null)hist.push([lastT,lastV]);
  const lines=[];
  const add=(o,dash,col,anchor)=>{if(!o||!o.pts||!o.pts.length)return;let pts=o.pts.map(q=>[mend(q[0]),q[1]]);if(anchor){pts=pts.filter(q=>q[0]>lastT);if(lastV!=null)pts.unshift([lastT,lastV])}if(pts.length>1)lines.push({name:o.name,prob:o.prob,pts:pts,dash:dash,col:col,endv:pts[pts.length-1][1]})};
  const SC={A:'var(--s1)',B:'var(--s2)',C:'var(--s3)',D:'var(--s4)'},sc=(o,d)=>SC[String(o&&o.name||'').charAt(0)]||d;
  add(p.base,'7 4',sc(p.base,'var(--s2)'),true);
  (p.bands||[]).forEach((b,i)=>add(b,i?'10 3 2 3':'3 3',sc(b,i?'var(--s3)':'var(--s1)'),true));
  if(p.prev&&p.prev.pts)add({name:'Prior call ('+sd(p.prev.asof)+')',pts:p.prev.pts},'1 4','var(--ink3)',false);
  const tws=(D.tripwires||[]).filter(t=>t.series===id&&t.level!=null);
  const all=hist.concat.apply(hist,lines.map(l=>l.pts));if(all.length<2)return '';
  const x0=Math.min.apply(null,all.map(q=>q[0])),x1=Math.max.apply(null,all.map(q=>q[0]));
  const yvals=all.map(q=>q[1]).concat(tws.map(t=>t.level));
  let y0=Math.min.apply(null,yvals),y1=Math.max.apply(null,yvals);const pad=(y1-y0)*0.08||1;y0-=pad;y1+=pad;
  const X=t=>L+(W-L-R)*(t-x0)/(x1-x0),Y=v=>T+(H-T-B)*(1-(v-y0)/(y1-y0));
  const u=s?s.unit:'';
  const fr=v=>{const a=Math.abs(v);if(u==='usd'||u==='idx')return (u==='usd'?'$':'')+(a>=10000?nf(a/1000,a>=100000?0:1)+'k':nf(a,a>=100?0:2));return fv(v,u,id)};
  let g='';
  for(let k=0;k<=4;k++){const v=y0+(y1-y0)*k/4;g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--grid)"/><text x="'+(L-6)+'" y="'+(Y(v)+3.5).toFixed(1)+'" text-anchor="end" font-size="10.5" fill="var(--ink3)">'+fr(v)+'</text>'}
  const d0=new Date(x0);for(let y=d0.getUTCFullYear(),m=0;;m+=6){const t=Date.UTC(y,m,1);if(t>x1)break;if(t>=x0)g+='<text x="'+X(t).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10.5" fill="var(--ink3)">'+MON[m%12]+' '+String(y+Math.floor(m/12)).slice(2)+'</text>'}
  // Overlay live Tripwire threshold lines with compact non-overlapping callouts
  const twPlaced=tws.map(tw=>({tw:tw,yy:Y(tw.level),ly:Y(tw.level)-3})).sort((a,b)=>a.yy-b.yy);
  for(let i=0;i<twPlaced.length;i++){
    if(twPlaced[i].ly<T+10)twPlaced[i].ly=T+10;
    if(i>0&&twPlaced[i].ly-twPlaced[i-1].ly<13)twPlaced[i].ly=twPlaced[i-1].ly+13;
  }
  if(twPlaced.length&&twPlaced[twPlaced.length-1].ly>H-B-4){
    twPlaced[twPlaced.length-1].ly=H-B-4;
    for(let i=twPlaced.length-2;i>=0;i--){
      if(twPlaced[i+1].ly-twPlaced[i].ly<13)twPlaced[i].ly=twPlaced[i+1].ly-13;
    }
  }
  twPlaced.forEach(item=>{
    const tw=item.tw, col=tw.state==='tripped'?'var(--down)':tw.state==='near'?'var(--warn-c)':'var(--line2)';
    g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+item.yy.toFixed(1)+'" y2="'+item.yy.toFixed(1)+'" stroke="'+col+'" stroke-dasharray="4 3" opacity="0.75"/>'
      +'<text x="'+(W-R-2)+'" y="'+item.ly.toFixed(1)+'" text-anchor="end" font-family="var(--mono)" font-size="9.2" font-weight="600" fill="'+col+'"><title>'+esc(tw.label)+' ('+fr(tw.level)+')</title>⚡ '+fr(tw.level)+'</text>';
  });
  g+='<line x1="'+X(lastT).toFixed(1)+'" x2="'+X(lastT).toFixed(1)+'" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--line2)" stroke-dasharray="2 3"/><text x="'+(X(lastT)-4).toFixed(1)+'" y="'+(T+10)+'" text-anchor="end" font-size="10" fill="var(--ink3)">now</text>';
  const path=pts=>pts.map((q,i)=>(i?'L':'M')+X(q[0]).toFixed(1)+' '+Y(q[1]).toFixed(1)).join('');
  g+='<path d="'+path(hist)+'" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>';
  lines.forEach(l=>{const e=l.pts[l.pts.length-1];g+='<path d="'+path(l.pts)+'" fill="none" stroke="'+l.col+'" stroke-width="2" stroke-dasharray="'+l.dash+'"/><circle cx="'+X(e[0]).toFixed(1)+'" cy="'+Y(e[1]).toFixed(1)+'" r="3.8" fill="'+l.col+'" stroke="var(--bg)" stroke-width="1.5"/>'});
  const shortNm=nm=>/^Prior/i.test(nm)?'Prior':(/^[A-D]\b/.test(nm)?nm.charAt(0):nm.slice(0,10));
  const leg='<span class="xs"><b style="color:var(--ink)">—</b> Actual <b>'+fr(lastV)+'</b></span>'+lines.map(l=>'<span class="xs" style="margin-left:7px"><b style="color:'+l.col+'">---</b> '+esc(shortNm(l.name))+(l.prob?' '+l.prob+'%':'')+' → <b>'+fr(l.endv)+'</b></span>').join('');
  const twNote=tws.length?'⚡ '+tws.map(t=>esc(t.label)+' ('+fr(t.level)+')').join(' · '):'Hover or tap chart to inspect dates';
  const key='pc-'+id;PC[key]={hist:hist,lines:lines,x0:x0,x1:x1,L:L,R:R,W:W,fr:fr};
  return '<div class="panel"><div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;margin-bottom:4px"><h4>'+esc(p.label)+'</h4><div>'+leg+'</div></div><div class="pc" id="'+key+'"><svg viewBox="0 0 '+W+' '+H+'">'+g+'<line class="xh" x1="0" x2="0" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--brand)" visibility="hidden"/></svg><div class="tip" hidden></div><div class="pc-readout"><span class="xs">'+twNote+'</span></div></div>'+(p.note?'<p class="xs mut" style="margin-top:4px">'+esc(p.note)+'</p>':'')+'</div>';
}

function wirePaths(){
  const at=(pts,t)=>{if(!pts.length||t<pts[0][0]||t>pts[pts.length-1][0])return null;for(let i=1;i<pts.length;i++){if(t<=pts[i][0]){const a=pts[i-1],b=pts[i],f=(t-a[0])/((b[0]-a[0])||1);return a[1]+(b[1]-a[1])*f}}return pts[pts.length-1][1]};
  Object.keys(PC).forEach(key=>{
    const c=PC[key],box=el(key);if(!box)return;
    const svg=box.querySelector('svg'),xh=box.querySelector('.xh'),tip=box.querySelector('.tip'),ro=box.querySelector('.pc-readout');
    const inspect=(e,showTip)=>{
      const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)/Math.max(1,r.width)*c.W;
      const t=c.x0+(c.x1-c.x0)*Math.max(0,Math.min(1,(px-c.L)/(c.W-c.L-c.R)));
      const d=new Date(t),rows=[];const hv=at(c.hist,t);if(hv!=null)rows.push('Actual: <b class="mono">'+c.fr(hv)+'</b>');
      c.lines.forEach(l=>{const v=at(l.pts,t);if(v!=null)rows.push(esc(l.name.split(' (')[0])+': <b class="mono">'+c.fr(v)+'</b>')});
      const sx=c.L+(c.W-c.L-c.R)*(t-c.x0)/(c.x1-c.x0);xh.setAttribute('x1',sx);xh.setAttribute('x2',sx);xh.setAttribute('visibility','visible');
      const dStr=MON[d.getUTCMonth()]+' '+d.getUTCFullYear();
      if(ro)ro.innerHTML='<b>'+dStr+'</b><span>'+rows.join(' · ')+'</span>';
      if(showTip){
        tip.innerHTML='<span class="mut">'+dStr+'</span><br>'+rows.join('<br>');tip.hidden=false;
        const left=sx/c.W*r.width, tw=tip.offsetWidth||160;
        tip.style.left=(left>r.width/2?Math.max(4,left-tw-10):Math.min(r.width-tw-4,left+10))+'px';
      }
    };
    svg.addEventListener('pointermove',e=>inspect(e,e.pointerType!=='touch'));
    svg.addEventListener('pointerdown',e=>inspect(e,false));
    svg.addEventListener('click',e=>inspect(e,false));
    svg.addEventListener('pointerleave',()=>{tip.hidden=true;xh.setAttribute('visibility','hidden')});
  });
}

function analogConeSvg(ms){
  const assets=[['spx','S&P 500',0],['ust10','10Y Yield (bp)',1],['gold','Gold',0],['oil','Crude Oil',0],['dxy','US Dollar',0],['btc','Bitcoin',0]];
  const med=a=>{a=a.slice().sort((x,y)=>x-y);const n=a.length;return n?(n%2?a[(n-1)/2]:(a[n/2-1]+a[n/2])/2):null};
  const rows=[];
  assets.forEach(as=>{
    const v3=ms.map(m=>AN[m.id]&&AN[m.id].fwd&&AN[m.id].fwd[as[0]]&&AN[m.id].fwd[as[0]]['3m']).filter(x=>x!=null);
    const v12=ms.map(m=>AN[m.id]&&AN[m.id].fwd&&AN[m.id].fwd[as[0]]&&AN[m.id].fwd[as[0]]['12m']).filter(x=>x!=null);
    if(v3.length>=2)rows.push({lbl:as[1],bp:as[2],v3:v3,m3:med(v3),v12:v12,m12:med(v12)});
  });
  if(!rows.length)return '';
  return '<div class="grid3" style="margin-top:8px">'+rows.map(r=>{
    const fmt=v=>v==null?'–':(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(r.bp?0:1)+(r.bp?'bp':'%');
    const lo3=Math.min.apply(null,r.v3), hi3=Math.max.apply(null,r.v3);
    const lo12=r.v12.length?Math.min.apply(null,r.v12):0, hi12=r.v12.length?Math.max.apply(null,r.v12):0;
    const lim=Math.max(Math.abs(lo3),Math.abs(hi3),Math.abs(lo12),Math.abs(hi12),10)*1.1;
    const X=v=>50+46*(v/lim);
    const bar=(lo,hi,md,lbl)=>'<div style="margin-top:5px"><div style="display:flex;justify-content:space-between;font-size:11px"><span class="mut">'+lbl+'</span><span class="mono '+(md>=0?'up':'down')+'">med <b>'+fmt(md)+'</b> <span class="mut">('+fmt(lo)+'..'+fmt(hi)+')</span></span></div>'
      +'<svg viewBox="0 0 100 14" style="width:100%;height:14px;display:block"><line x1="50" x2="50" y1="1" y2="13" stroke="var(--line2)"/><line x1="4" x2="96" y1="7" y2="7" stroke="var(--panel2)" stroke-width="4" stroke-linecap="round"/>'
      +'<line x1="'+X(lo).toFixed(1)+'" x2="'+X(hi).toFixed(1)+'" y1="7" y2="7" stroke="var(--accent)" stroke-width="4" opacity="0.45" stroke-linecap="round"/>'
      +'<circle cx="'+X(md).toFixed(1)+'" cy="7" r="3.6" fill="'+(md>=0?'var(--up)':'var(--down)')+'"/></svg></div>';
    return '<div style="background:var(--panel2);padding:9px 11px;border-radius:9px"><b style="font-size:12.5px">'+esc(r.lbl)+'</b>'+bar(lo3,hi3,r.m3,'3m forward')+bar(lo12,hi12,r.m12,'12m forward')+'</div>';
  }).join('')+'</div>';
}

          +'<div style="display:flex;justify-content:space-between;align-items:baseline;gap:6px"><h4>'+esc(s.title)+'</h4><span class="pill '+(dl<=14?'warn':'b2')+'">'+(dl<=0?'Due':dl+'d · '+sd(s.horizon))+'</span></div>'
          +'<div class="pbar">'+s.outcomes.map((o,i)=>'<i style="width:'+o.prob+'%;background:var(--s'+(i+1)+')"></i>').join('')+'</div>'
          +'<div class="xs">'+(s.outcomes||[]).map((o,i)=>'<span style="margin-right:10px"><span class="sw" style="background:var(--s'+(i+1)+')"></span>'+esc(o.name)+' <b class="mono">'+o.prob+'%</b></span>').join('')+'</div>'
          +edgeSvg+'</summary>'
          +'<div class="xs mut" style="margin-top:7px;padding-top:6px;border-top:1px dashed var(--line)">'
          +'<p>'+esc(s.question)+'</p>'
          +(fo?'<p style="margin-top:4px"><b>First odds ('+esc(fo.asof)+'):</b> '+Object.keys(fo.probs).map(k=>esc(k)+' '+fo.probs[k]+'%').join(' · ')+'</p>':'')
          +'<p style="margin-top:4px"><b>Anchor:</b> '+esc(s.anchor)+'</p></div></details>';
      }).join('')+'</div>';
  }

  // Condensed Tripwire Proximity Radar
  const T=(D.tripwires||[]).slice(), ord={tripped:0,near:1,far:2,unknown:3};
  T.sort((a,b)=>ord[a.state]-ord[b.state]||(b.closeness||0)-(a.closeness||0));
  if(T.length){
    const hot=T.filter(t=>t.state==='tripped'||t.state==='near'), rest=T.filter(t=>t.state!=='tripped'&&t.state!=='near');
    const twRow=t=>{
      const pc=Math.round((t.meter||0)*100), col=t.state==='tripped'?'var(--down)':t.state==='near'?'var(--warn-c)':'var(--ink3)';
      const stTxt=t.state==='tripped'?'TRIPPED':(t.gap!=null?t.gap.toFixed(1)+'% away':'–');
      return '<details class="tw-row '+t.state+'"><summary style="display:contents;cursor:pointer">'
        +'<span><b>'+esc(t.label)+'</b><span class="xs mut" style="display:block">'+esc(t.confirms)+'</span></span>'
        +'<span class="mono xs" style="text-align:right"><b>'+fv(t.value,t.unit,t.series)+'</b> <span class="mut">'+(t.op==='>='?'≥':'≤')+fv(t.level,t.unit,t.series)+'</span></span>'
        +'<span class="meter"><i style="width:'+pc+'%;background:'+col+'"></i></span>'
        +'<span class="mono xs" style="text-align:right"><span class="pill '+(t.state==='tripped'?'bad':t.state==='near'?'warn':'')+'">'+stTxt+'</span></span>'
        +'</summary><div class="xs mut" style="grid-column:1/-1;padding-top:5px">'+(t.action?'<b>Then:</b> '+esc(t.action)+' · ':'')+esc(t.why||'')+'</div></details>';
    };
    h+='<h3>Tripwire Proximity Radar ('+hot.length+' Tripped/Close · '+rest.length+' Watching — click row for action rule)</h3>'
      +'<div class="panel">'+hot.map(twRow).join('')
      +(rest.length?'<details style="margin-top:6px"><summary class="xs mut" style="cursor:pointer;padding:4px 0">Show '+rest.length+' distant tripwires (&gt;5% away)</summary>'+rest.map(twRow).join('')+'</details>':'')
      +'</div>';
  }

  // Historical Analog Forward-Return Range Plot
  const ms=(D.matches||[]).filter(m=>AN[m.id]);
  if(ms.length){
    h+='<h3>Historical Regime Analogs — Forward Return Distribution ('+ms.length+' Hybrid Tag + Quant Matches)</h3>'
      +'<div class="panel">'
      +'<div style="display:flex;flex-wrap:wrap;gap:6px">'+ms.map(m=>{const a=AN[m.id];return '<span class="chip"><b class="mono" style="color:var(--brand)">'+Math.round(m.score*100)+'%</b> '+esc(a.name)+' ('+a.date.slice(0,4)+')</span>'}).join('')+'</div>'
      +analogConeSvg(ms)
      +'<details style="margin-top:8px"><summary class="xs mut" style="cursor:pointer">Inspect individual historical episodes &amp; lessons</summary><div class="grid3" style="margin-top:8px">'
      +ms.map(m=>{const a=AN[m.id];return '<div style="background:var(--panel2);padding:8px 10px;border-radius:8px" class="xs"><b>'+esc(a.name)+' ('+a.date.slice(0,7)+')</b><p class="mut" style="margin-top:3px">'+esc(a.what_happened)+'</p><p style="margin-top:4px"><b>Lesson:</b> '+esc(a.lesson)+'</p></div>'}).join('')
      +'</div></details></div>';
  }

  const od=N.odds||[];
  if(od.length){
    h+='<details class="more" style="margin-top:10px"><summary>Live Prediction-Market Anchors <span>'+od.length+' high-volume Kalshi &amp; Polymarket contracts</span></summary>'
      +'<div class="panel ox"><table class="tbl"><thead><tr><th>Market</th><th class="r">Implied Odds</th><th>Closes</th><th>Venue</th></tr></thead><tbody>'
      +od.map(o=>'<tr><td>'+link(o.url,esc(o.question))+(o.outcome&&o.outcome!=='Yes'?' <span class="mut">('+esc(o.outcome)+')</span>':'')+'</td><td class="num"><b>'+nf(o.prob,0)+'%</b></td><td>'+sd(o.close)+'</td><td>'+esc(o.venue)+'</td></tr>').join('')
      +'</tbody></table></div></details>';
  }

  el('scenarios').innerHTML=h;

  if(pk.length){
    const coreIds=['spx','btc','dgs10','wti'].filter(x=>P[x]);
    const drawPaths=mode=>{
      Object.keys(PC).forEach(k=>delete PC[k]);
      const list=mode==='core'&&coreIds.length?coreIds:pk;
      el('paths-box').innerHTML=list.map(k=>pathChart(k,P[k])).join('');
      wirePaths();
    };
    el('path-tabs').querySelectorAll('.fb').forEach(b=>b.addEventListener('click',()=>{
      el('path-tabs').querySelectorAll('.fb').forEach(x=>x.classList.toggle('on',x===b));
      drawPaths(b.getAttribute('data-pk'));
    }));
    drawPaths('core');
  }
}

/* ==================== 5. ROADMAP, SEASONALITY & CATALYST HORIZON ==================== */
const CYC={0:'election',1:'post_election',2:'midterm',3:'pre_election'};
function seasonStat(ym){
  const y=+ym.slice(0,4),m=String(+ym.slice(5,7)),c=CYC[y%4];
  return N.seasonal&&N.seasonal.by_type&&N.seasonal.by_type[c]&&N.seasonal.by_type[c][m]||null;
}

function roadmapComboSvg(rm){
  const W=860,H=218,L=42,R=16,T=16,M=112,n=rm.length;
  const colW=(W-L-R)/n;
  const X=i=>L+colW*(i+0.5), Yd=d=>T+(M-T-12)*(1-(d-1)/9);
  let g='';
  [3,5,7].forEach(d=>{g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Yd(d).toFixed(1)+'" y2="'+Yd(d).toFixed(1)+'" stroke="var(--grid)"/><text x="'+(L-6)+'" y="'+(Yd(d)+3.5).toFixed(1)+'" text-anchor="end" font-size="9.5" fill="var(--ink3)">Dial '+d+'</text>'});
  const dpts=rm.map((m,i)=>X(i).toFixed(1)+' '+Yd(m.dial).toFixed(1));
  g+='<path d="M'+X(0).toFixed(1)+' '+(M-10)+' L'+dpts.join(' L')+' L'+X(n-1).toFixed(1)+' '+(M-10)+' Z" fill="var(--brand)" opacity="0.10"/>'
    +'<path d="M'+dpts.join(' L')+'" fill="none" stroke="var(--brand)" stroke-width="2.4" stroke-linejoin="round"/>';
  const zy=M+42;
  g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+zy+'" y2="'+zy+'" stroke="var(--line2)"/>'
    +'<text x="'+(L-6)+'" y="'+(zy+3)+'" text-anchor="end" font-size="9" fill="var(--ink3)">SPX 0%</text>';
  const bcols=['var(--b0)','var(--b1)','var(--b2)','var(--b3)','var(--b4)'];
  const binks=['var(--b0i)','var(--b1i)','var(--b2i)','var(--b3i)','var(--b4i)'];
  rm.forEach((m,i)=>{
    const x=X(i), yd=Yd(m.dial), se=seasonStat(m.month), avg=se?se.avg:0;
    const bh=Math.min(28,Math.abs(avg)*8.5), bi=bandOf(m.dial);
    g+='<g class="rm-col" data-i="'+i+'" style="cursor:pointer">'
      +'<rect x="'+(L+i*colW+1).toFixed(1)+'" y="8" width="'+(colW-2).toFixed(1)+'" height="'+(H-14)+'" fill="transparent"/>'
      +(m.month===CURM?'<rect x="'+(L+i*colW+2).toFixed(1)+'" y="8" width="'+(colW-4).toFixed(1)+'" height="'+(H-28)+'" rx="6" fill="var(--brand)" opacity="0.08" stroke="var(--brand)" stroke-dasharray="2 2"/>':'')
      +'<circle cx="'+x.toFixed(1)+'" cy="'+yd.toFixed(1)+'" r="10" fill="'+bcols[bi]+'" stroke="var(--ink)" stroke-width="'+(i===0?1.8:0.6)+'"/>'
      +'<text x="'+x.toFixed(1)+'" y="'+(yd+3.8).toFixed(1)+'" text-anchor="middle" font-family="var(--mono)" font-size="10.5" font-weight="700" fill="'+binks[bi]+'">'+m.dial+'</text>'
      +(se?'<rect x="'+(x-colW*0.3).toFixed(1)+'" y="'+(avg>=0?zy-bh:zy).toFixed(1)+'" width="'+(colW*0.6).toFixed(1)+'" height="'+Math.max(2,bh).toFixed(1)+'" rx="2" fill="'+(avg>=0?'var(--up)':'var(--down)')+'" opacity="0.8"/>'
        +'<text x="'+x.toFixed(1)+'" y="'+(avg>=0?zy-bh-4:zy+bh+10).toFixed(1)+'" text-anchor="middle" font-family="var(--mono)" font-size="8.5" fill="var(--ink3)">'+(avg>0?'+':'')+avg.toFixed(1)+'%</text>':'')
      +'<text x="'+x.toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10" font-weight="'+(m.month===CURM?'700':'500')+'" fill="'+(m.month===CURM?'var(--brand)':'var(--ink2)')+'">'+fm(m.month)+'</text>'
      +'</g>';
  });
  return '<div class="ox-svg"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+g+'</svg></div>';
}

function catalystSwimlaneBuild(evs){
  const up=evs.filter(e=>days(e.date)>=0&&days(e.date)<=45&&e.imp>=2).slice().sort((a,b)=>days(a.date)-days(b.date)||(b.imp||0)-(a.imp||0));
  if(!up.length)return {html:'',clusters:[]};
  const W=860,H=118,L=46,R=46,spineY=56;
  const X=d=>L+(W-L-R)*Math.max(0,Math.min(45,d))/45;
  // Group events within <= 1 day into clusters
  const clusters=[];
  up.forEach(e=>{
    const d=days(e.date);
    const last=clusters[clusters.length-1];
    if(last&&Math.abs(d-last.day)<=1){
      last.events.push(e);
      if((e.imp||0)>last.maxImp){last.maxImp=e.imp||2;last.lead=e}
    }else{
      clusters.push({day:d,date:e.date,events:[e],maxImp:e.imp||2,lead:e});
    }
  });
  clusters.forEach((c,i)=>{c.idx=i;c.x=X(c.day);c.events.sort((a,b)=>(b.imp||0)-(a.imp||0));c.lead=c.events[0]});

  // Greedy horizontal interval scheduling across 3 non-overlapping Y lanes
  const lanes=[{y:18,used:[]},{y:36,used:[]},{y:84,used:[]}];
  const order=clusters.slice().sort((a,b)=>b.maxImp-a.maxImp||a.day-b.day);
  order.forEach(c=>{
    const raw=String(c.lead.title||'');
    const short=raw.length>19?raw.slice(0,18)+'…':raw;
    const lbl=short+(c.events.length>1?' (+'+(c.events.length-1)+')':'');
    const tw=lbl.length*6.2+12;
    let anc='middle', tx=c.x, x0=tx-tw/2, x1=tx+tw/2;
    if(c.x<L+62){anc='start';tx=Math.max(8,c.x-4);x0=tx;x1=tx+tw}
    else if(c.x>W-R-62){anc='end';tx=Math.min(W-8,c.x+4);x0=tx-tw;x1=tx}
    if(x0<8){const sh=8-x0;tx+=sh;x0=8;x1+=sh}
    if(x1>W-8){const sh=x1-(W-8);tx-=sh;x0-=sh;x1=W-8}
    for(let li=0;li<lanes.length;li++){
      const ln=lanes[li];
      if(ln.used.every(u=>x1+10<=u[0]||x0>=u[1]+10)){
        ln.used.push([x0,x1]);
        c.lbl={txt:lbl,tx:tx,y:ln.y,anc:anc};
        break;
      }
    }
  });

  let g='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+spineY+'" y2="'+spineY+'" stroke="var(--line2)" stroke-width="2"/>';
  [0,7,14,21,30,45].forEach(d=>{
    const x=X(d);
    g+='<line x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+(spineY-5)+'" y2="'+(spineY+5)+'" stroke="var(--line2)"/>'
      +'<text x="'+x.toFixed(1)+'" y="110" text-anchor="middle" font-size="9.5" fill="var(--ink3)">'+(d===0?'Today':'+'+d+'d')+'</text>';
  });
  clusters.forEach(c=>{
    const e=c.lead, hi=c.maxImp>=3;
    const col=e.type==='policy'?'var(--warn-c)':e.type==='macro'?'var(--brand)':e.type==='flows'?'var(--s4)':'var(--ink3)';
    const r=hi?5.8:4.5;
    let stem='';
    if(c.lbl){
      const y1=c.lbl.y<spineY?spineY-r:spineY+r, y2=c.lbl.y<spineY?c.lbl.y+4:c.lbl.y-11;
      stem='<line x1="'+c.x.toFixed(1)+'" x2="'+c.x.toFixed(1)+'" y1="'+y1.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="'+col+'" stroke-width="1.2" opacity="0.65"/>'
        +'<text x="'+c.lbl.tx.toFixed(1)+'" y="'+c.lbl.y+'" text-anchor="'+c.lbl.anc+'" font-size="9" font-weight="'+(hi?'700':'500')+'" fill="var(--ink)">'+esc(c.lbl.txt)+'</text>';
    }
    g+='<g class="cat-node" data-ci="'+c.idx+'" style="cursor:pointer">'+stem
      +'<circle cx="'+c.x.toFixed(1)+'" cy="'+spineY+'" r="11" fill="transparent"/>'
      +'<circle class="cat-dot" cx="'+c.x.toFixed(1)+'" cy="'+spineY+'" r="'+r+'" fill="'+col+'" stroke="var(--bg)" stroke-width="1.4"><title>'+esc(c.date+': '+c.events.map(ev=>ev.title).join(' · '))+'</title></circle>'
      +'</g>';
  });
  return {html:'<div class="ox-svg"><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+g+'</svg></div>',clusters:clusters};
}

        +story.map(s=>'<div class="xs" style="border-top:1px solid var(--line);padding-top:6px"><b>'+esc(s.phase)+' · '+esc(s.title)+'</b><p class="mut" style="margin-top:2px">'+esc(s.text)+'</p></div>').join('')+'</div></details>':'')
      +(reps.length?'<details class="panel"><summary style="cursor:pointer;font-weight:600">Research &amp; Reports ('+reps.length+' sourced notes)</summary><div style="margin-top:8px;max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:6px">'

      +'<span>'+'●'.repeat(e.imp||1)+'</span>'
      +'<div><b>'+esc(e.title)+'</b>'+(e.decides?' <span class="mut">— '+esc(e.decides)+'</span>':'')+(e.positioning?' <span style="color:var(--brand)">['+esc(e.positioning)+']</span>':'')+'</div></div>').join('')||'<p class="xs mut">No matching events.</p>';
  };
  const ct=el('cal-tabs');
  if(ct){
    ct.addEventListener('click',e=>{
      const b=e.target.closest('.fb');if(!b)return;
      const f=b.getAttribute('data-cf');
      if(f==='45'||f==='180'){cHorizon=+f;ct.querySelectorAll('[data-cf="45"],[data-cf="180"]').forEach(x=>x.classList.toggle('on',x===b))}
      else if(f==='key'){cKey=!cKey;b.classList.toggle('on',cKey)}
      else if(f==='astro'){cAstro=!cAstro;b.classList.toggle('on',cAstro)}
      drawCal();
    });
    drawCal();
  }
}

/* ==================== 6. VISUAL GAUGE HEATMAP & SCORECARD ==================== */
const GLABELS={economy:'Economy & Tax Cash',inflation:'Inflation',rates:'Interest Rates',liquidity:'Liquidity Plumbing',credit:'Credit & SLOOS',sentiment:'Volatility & Fear',positioning:'COT Positioning',crypto:'Crypto & ETFs',commodities:'Commodities',equities:'Equity Indexes',sectors:'US Sectors',styles:'Styles',industries:'US Industries',regions:'Global Regions',fx:'Currencies',themes:'Theme Tickers'};

function calibrationSvg(cal){
  const W=280,H=190,P=34;
  const X=p=>P+(W-2*P)*p/100, Y=p=>16+(H-44)*(1-p/100);
  let g='<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(100)+'" y2="'+Y(100)+'" stroke="var(--line2)" stroke-dasharray="3 3"/>';
  [0,50,100].forEach(p=>{
    g+='<text x="'+X(p)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9.5" fill="var(--ink3)">'+p+'%</text>'
      +'<text x="'+(P-5)+'" y="'+(Y(p)+3)+'" text-anchor="end" font-size="9.5" fill="var(--ink3)">'+p+'%</text>';
  });
  const pts=(cal||[]).filter(b=>b.n>0&&b.avg_prob!=null&&b.hit_rate!=null);
  if(pts.length>1)g+='<path d="'+pts.map((b,i)=>(i?'L':'M')+X(b.avg_prob).toFixed(1)+' '+Y(b.hit_rate).toFixed(1)).join('')+'" fill="none" stroke="var(--brand)" stroke-width="2"/>';
  pts.forEach(b=>{
    g+='<circle cx="'+X(b.avg_prob).toFixed(1)+'" cy="'+Y(b.hit_rate).toFixed(1)+'" r="'+(3.5+Math.min(5,b.n))+'" fill="var(--brand)"><title>Bucket '+b.bucket+'% (n='+b.n+'): avg '+b.avg_prob+'%, hit '+b.hit_rate+'%</title></circle>';
  });
  g+='<text x="'+(W/2)+'" y="11" text-anchor="middle" font-size="9.5" fill="var(--ink3)">Predicted Odds vs Realized Hit Rate (45° = ideal)</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:300px;height:auto;display:block">'+g+'</svg>';
}

function backtestSvg(B){
  if(!B||!B.bands)return '';
  const bands=B.bands;
  const W=420,H=165,L=114,rowH=24;
  const X=v=>245+(Math.max(-30,Math.min(20,v))/30)*115;
  let g='<line x1="'+X(0).toFixed(1)+'" x2="'+X(0).toFixed(1)+'" y1="12" y2="'+(bands.length*rowH+12)+'" stroke="var(--line2)"/>';
  bands.forEach((b,i)=>{
    const y=22+i*rowH, f6=b.fwd6||0, dd=b.dd6||0;
    g+='<text x="'+(L-8)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="10.2" fill="var(--ink)">'+esc(b.band)+' ('+(b.share||0)+'%)</text>'
      +(b.fwd6!=null?'<line x1="'+X(0).toFixed(1)+'" x2="'+X(f6).toFixed(1)+'" y1="'+(y-3)+'" y2="'+(y-3)+'" stroke="var(--up)" stroke-width="5" stroke-linecap="round"/>':'')
      +(b.dd6!=null?'<line x1="'+X(0).toFixed(1)+'" x2="'+X(dd).toFixed(1)+'" y1="'+(y+4)+'" y2="'+(y+4)+'" stroke="var(--down)" stroke-width="5" stroke-linecap="round" opacity="0.8"/>':'')
      +'<text x="'+(W-4)+'" y="'+(y+3)+'" text-anchor="end" font-family="var(--mono)" font-size="9.2" fill="var(--ink3)">'+(b.fwd6!=null?(b.fwd6>=0?'+':'')+b.fwd6+'%':'–')+' / '+(b.dd6!=null?b.dd6+'%':'–')+'</text>';
  });
  g+='<text x="'+(W/2)+'" y="'+(H-6)+'" text-anchor="middle" font-size="9.5" fill="var(--ink3)">2007–2026 Backtest: Green = Avg 6m Return · Red = Avg 6m Worst Fall</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+g+'</svg>';
}

function renderGauges(){
  const ids=Object.keys(S).sort();
  const byGrp={};ids.forEach(id=>{const g=S[id].group||'other';(byGrp[g]=byGrp[g]||[]).push(id)});
  let selGrp='all', filterMode='all', query='';

  // Build group heatmap tiles + custom Themes
  const tiles=[];
  (V.themes||[]).forEach((t,i)=>{
    const tid='theme:'+i, sids=(t.series||[]).filter(x=>S[x]);
    const c1w=sids.map(x=>S[x].chg&&S[x].chg['1w']).filter(x=>x!=null);
    const avg=c1w.length?c1w.reduce((a,b)=>a+b,0)/c1w.length:0;
    tiles.push({id:tid,label:'★ '+t.name,cnt:sids.length,avg:avg,read:t.read,sids:sids});
  });
  Object.keys(GLABELS).forEach(g=>{
    const sids=byGrp[g];if(!sids||!sids.length)return;
    const ma=sids.filter(x=>S[x].ma40w&&S[x].last!=null);
    const pctAbove=ma.length?Math.round(100*ma.filter(x=>S[x].last>S[x].ma40w).length/ma.length):null;
    tiles.push({id:g,label:GLABELS[g],cnt:sids.length,pctAbove:pctAbove,read:V.notes&&V.notes[g],sids:sids});
  });

  let h=head('Visual Gauge Heatmap & Accountability ('+ids.length+' Live Series)','Filter live series, inspect 1y ranges, Fed path, and calibration.');
  h+='<div class="gtiles" id="g-tiles">'
    +'<button type="button" class="gtile on" data-g="all"><div class="xs mut">ALL SERIES</div><b class="mono" style="font-size:15px">'+ids.length+' gauges</b><div class="xs mut">Full universe</div></button>'
    +tiles.map(t=>'<button type="button" class="gtile" data-g="'+esc(t.id)+'"><div class="xs" style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(t.label)+'</div>'
      +'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:3px"><span class="mono xs mut">'+t.cnt+' series</span>'
      +(t.pctAbove!=null?'<span class="mono xs '+(t.pctAbove<35?'down':t.pctAbove>65?'up':'mut')+'">'+t.pctAbove+'% &gt;40w</span>':(t.avg!=null?'<span class="mono xs '+(t.avg>=0?'up':'down')+'">1w '+(t.avg>=0?'+':'')+t.avg.toFixed(1)+'%</span>':''))+'</div>'
      +(t.pctAbove!=null?'<div class="meter" style="height:4px;margin-top:4px"><i style="width:'+t.pctAbove+'%;background:'+(t.pctAbove<35?'var(--down)':t.pctAbove>65?'var(--up)':'var(--warn-c)')+'"></i></div>':'')
      +'</button>').join('')+'</div>'
    +'<div id="g-note" class="xs mut" style="margin-bottom:8px"></div>'
    +'<div class="searchbar"><div class="searchwrap"><input id="g-q" type="search" aria-label="Search gauges" placeholder="Search '+ids.length+' gauges (e.g. tax, sloos, tbill, nvda, brent, hy_oas, btc...)"><kbd class="kbd" title="Press / to search">/</kbd></div>'
    +'<button class="fb on" data-f="all">All</button>'
    +'<button class="fb" data-f="below">Below 40w MA</button>'
    +'<button class="fb" data-f="above">Above 40w MA</button>'
    +'<button class="fb" data-f="stale">Stale</button></div>'
    +'<div class="panel ox"><table class="gt"><thead><tr><th>Gauge</th><th class="r">Now</th><th class="r">1w</th><th class="r">1m</th><th class="r">3m</th><th class="r">1y Range</th><th class="r">2y Path</th><th class="r">40w</th></tr></thead><tbody id="g-rows"></tbody></table></div>';

  // Fed Futures Curve + Accountability Scorecard + Backtest condensed below
  const fp=N.fed_path||[], c=D.scorecard||{n:0}, B=D.backtest;
  h+='<div class="grid2" style="margin-top:12px">';
  if(fp.length>1){
    const W=440,H=150,L=42,R=24,T=14,Bm=24,vs=fp.map(p=>p.rate),now=S.dff?S.dff.last:null;
    let mn=Math.min.apply(null,vs.concat(now==null?[]:[now])),mx=Math.max.apply(null,vs.concat(now==null?[]:[now]));const pad=(mx-mn)*0.18||0.1;mn-=pad;mx+=pad;
    const X=i=>L+(W-L-R)*i/(fp.length-1),Y=v=>T+(H-T-Bm)*(1-(v-mn)/(mx-mn));
    let fgSvg='';
    for(let k=0;k<=2;k++){const v=mn+(mx-mn)*k/2;fgSvg+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--grid)"/><text x="'+(L-5)+'" y="'+(Y(v)+3.5).toFixed(1)+'" text-anchor="end" font-size="10" fill="var(--ink3)">'+v.toFixed(2)+'%</text>'}
    if(now!=null)fgSvg+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(now).toFixed(1)+'" y2="'+Y(now).toFixed(1)+'" stroke="var(--ink3)" stroke-dasharray="3 3"/>';
    fgSvg+='<path d="'+fp.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.rate).toFixed(1)).join('')+'" fill="none" stroke="var(--brand)" stroke-width="2.2"/>'
      +fp.map((p,i)=>'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.rate).toFixed(1)+'" r="3" fill="var(--brand)"><title>'+fm(p.month)+': '+p.rate.toFixed(2)+'%</title></circle>'+(i%3===0?'<text x="'+X(i).toFixed(1)+'" y="'+(H-5)+'" text-anchor="middle" font-size="9.5" fill="var(--ink3)">'+fm(p.month)+'</text>':'')).join('');
    h+='<div class="panel"><h3 class="chd">Fed Funds Futures Implied Rate Path</h3><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block;margin-top:6px">'+fgSvg+'</svg></div>';
  }
  h+='<div class="panel"><div style="display:flex;justify-content:space-between;align-items:baseline"><h3 class="chd">Accountability Scorecard &amp; Calibration</h3><span class="xs mut">'+(c.n||0)+' resolved calls</span></div>'
    +(c.n?'<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,220px);gap:10px;align-items:center;margin-top:6px">'
      +'<div class="kv" style="margin:0">'
      +'<div><dt>Mean Brier</dt><dd class="num">'+c.mean_brier.toFixed(3)+' <span class="xs mut">/ '+c.baseline_brier.toFixed(3)+'</span></dd></div>'
      +'<div><dt>Brier Skill</dt><dd class="num '+(c.brier_skill>0?'up':'down')+'">'+(c.brier_skill>0?'+':'')+(c.brier_skill*100).toFixed(1)+'%</dd></div>'
      +'<div><dt>Log Score</dt><dd class="num">'+c.mean_log.toFixed(3)+'</dd></div>'
      +'<div><dt>Revision Gain</dt><dd class="num up">'+(c.revision_gain!=null?(c.revision_gain>=0?'+':'')+c.revision_gain.toFixed(3):'–')+'</dd></div>'
      +'</div>'+calibrationSvg(c.calibration)+'</div>'
      +(c.recent&&c.recent.length?'<details style="margin-top:6px"><summary class="xs mut" style="cursor:pointer">Resolved ledger entries ('+c.recent.length+')</summary><div class="xs" style="margin-top:4px">'
        +c.recent.map(r=>'<div style="padding:4px 0;border-top:1px solid var(--line)"><b>'+esc(r.id)+'</b> → <span class="up">'+esc(r.outcome)+'</span> · Brier <span class="mono">'+Number(r.brier).toFixed(3)+'</span> ('+esc(r.resolved)+')</div>').join('')+'</div></details>':'')
      :'<p class="xs mut" style="margin-top:8px">No calls resolved yet.</p>')
    +'</div></div>';

  if(B){
    h+='<details class="more" style="margin-top:12px"><summary>Rule Engine Historical Backtest (2007–2026) &amp; Research Figures <span>'+nf(B.weeks||0,0)+' weekly observations</span></summary>'
      +'<div class="grid2" style="margin-top:8px"><div class="panel">'+backtestSvg(B)+'<p class="xs mut" style="margin-top:6px">'+esc(B.limits||'')+'</p></div>'
      +'<div class="panel"><h3 class="chd">Sourced Research Figures (Manual Layer)</h3><div style="max-height:220px;overflow-y:auto;margin-top:6px">'
      +Object.keys(V.manual||{}).map(k=>{const m=V.manual[k];return '<div class="xs" style="display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px solid var(--line)"><span>'+esc(m.label||k)+'</span><span class="mono"><b>'+esc(m.value)+esc(m.unit||'')+'</b> <span class="mut">('+sd(m.date)+')</span></span></div>'}).join('')
      +'</div></div></div></details>';
  }

  el('gauges').innerHTML=h;

  const tileMap={};tiles.forEach(t=>{tileMap[t.id]=t});
  function drawGauges(){
    const q=query.trim().toLowerCase();
    const baseIds=selGrp==='all'?ids:(tileMap[selGrp]?tileMap[selGrp].sids:ids);
    el('g-note').textContent=(tileMap[selGrp]&&tileMap[selGrp].read)?tileMap[selGrp].read:'';
    const list=baseIds.filter(id=>{
      const s=S[id];if(!s)return false;
      if(filterMode==='below'&&!(s.ma40w&&s.last<s.ma40w))return false;
      if(filterMode==='above'&&!(s.ma40w&&s.last>s.ma40w))return false;
      if(filterMode==='stale'&&!s.stale)return false;
      if(!q)return true;
      return id.toLowerCase().includes(q)||(s.label||'').toLowerCase().includes(q)||(s.group||'').toLowerCase().includes(q);
    });
    const fc=(s,hz,id)=>{const v=s.chg&&s.chg[hz];if(v==null)return '<span class="mut">–</span>';const u=s.unit;const txt=(v>0?'+':v<0?'−':'')+(id==='btc_etf_flow'?'$'+nf(Math.abs(v)/1e6,1)+'m':u==='%'||u==='bp'?Math.abs(v).toFixed(2)+'pp':s.chg_abs?Math.abs(v).toFixed(1):Math.abs(v).toFixed(1)+'%');return '<span class="'+(v>0?'up':v<0?'down':'mut')+'">'+txt+'</span>'};
    el('g-rows').innerHTML=list.slice(0,150).map(id=>{
      const s=S[id], note=V.notes&&V.notes.gauges&&V.notes.gauges[id];
      const tr=s.ma40w?(s.last>s.ma40w?'<span class="up">▲</span>':'<span class="down">▼</span>'):'<span class="mut">–</span>';
      const pm=s.pct1y==null?'<span class="mut">–</span>':'<span class="pm" title="'+s.pct1y+'th 1y percentile"><i style="left:'+s.pct1y+'%"></i></span> <span class="mono xs mut">'+s.pct1y+'</span>';
      return '<tr><th scope="row"><b>'+esc(s.label)+'</b> <span class="mono xs mut">'+esc(id)+'</span>'+(s.stale?' <span class="pill warn">stale</span>':'')+(note?'<div class="xs mut">'+esc(note)+'</div>':'')+'</th>'
        +'<td class="num"><b>'+fv(s.last,s.unit,id)+'</b><div class="xs mut">'+sd(s.date)+'</div></td>'
        +'<td class="num">'+fc(s,'1w',id)+'</td><td class="num">'+fc(s,'1m',id)+'</td><td class="num">'+fc(s,'3m',id)+'</td>'
        +'<td>'+pm+'</td><td>'+spark(s.h,88,20)+'</td><td class="num">'+tr+'</td></tr>';
    }).join('')||'<tr><td colspan="8" class="mut">No matching gauges.</td></tr>';
  }
  el('g-tiles').addEventListener('click',e=>{
    const b=e.target.closest('.gtile');if(!b)return;
    selGrp=b.getAttribute('data-g');
    el('g-tiles').querySelectorAll('.gtile').forEach(x=>x.classList.toggle('on',x===b));
    drawGauges();
  });
  el('g-q').addEventListener('input',e=>{query=e.target.value;drawGauges()});
  el('gauges').querySelectorAll('.searchbar .fb').forEach(b=>b.addEventListener('click',()=>{
    filterMode=b.getAttribute('data-f');
    el('gauges').querySelectorAll('.searchbar .fb').forEach(x=>x.classList.toggle('on',x===b));
    drawGauges();
  }));
  drawGauges();
}

function renderFoot(){
  const m=D.meta||{};
  el('foot').innerHTML='<p><b>macroScan</b> · Analysis, not financial advice. General market research only; no position sizing or personalised recommendations.</p>'
    +'<p>Data budget: '+nf((m.data_bytes||0)/1000,0)+' KB of '+nf((m.cap||0)/1000,0)+' KB · Built '+esc(m.built||'')+' · On-demand zero-dependency build.</p>';
}

[renderPulse,renderFlows,renderSmartMoney,renderScenarios,renderHorizon,renderGauges,renderFoot].forEach(fn=>{
  try{fn()}catch(e){const d=document.createElement('div');d.className='warnbox';d.textContent='Section error ('+fn.name+'): '+e.message;document.querySelector('main').prepend(d)}
});
document.addEventListener('keydown',e=>{
  const gq=el('g-q');if(!gq)return;
  if(e.key==='/'&&!/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||'')){e.preventDefault();gq.focus();gq.select()}
  else if(e.key==='Escape'&&document.activeElement===gq){gq.value='';gq.dispatchEvent(new Event('input'));gq.blur()}
});
if('IntersectionObserver' in window){
  const links={};document.querySelectorAll('.nav a[href^="#"]').forEach(a=>{links[a.getAttribute('href').slice(1)]=a});
  const io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting&&links[en.target.id]){Object.values(links).forEach(a=>a.removeAttribute('aria-current'));links[en.target.id].setAttribute('aria-current','true')}})},{rootMargin:'-18% 0px -72% 0px'});
  Object.keys(links).forEach(id=>{const s=el(id);if(s)io.observe(s)});
}
})();
</script>
